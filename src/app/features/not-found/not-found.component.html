<main class="not-found">
  <app-empty-state
    class="not-found__card"
    variant="empty"
    icon="search_off"
    title="Página no encontrada"
    i18n-title="@@notFound.title"
    description="La dirección que buscó no existe o ya no está disponible."
    i18n-description="@@notFound.description"
  >
    <div actions class="not-found__actions">
      <app-button variant="primary" link="/dashboard">
        <mat-icon aria-hidden="true">home</mat-icon>
        <span i18n="@@notFound.home">Ir al inicio</span>
      </app-button>
    </div>
  </app-empty-state>
</main>
