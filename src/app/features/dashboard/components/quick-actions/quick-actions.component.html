<div class="qa-section">
  <div class="qa-section__header">
    <h2 class="qa-section__title">Accesos directos</h2>
    <span class="qa-section__subtitle">Adaptados a su rol</span>
    <span class="qa-section__role-badge">{{ roleLabels[role()] }}</span>
  </div>

  <div class="qa-section__grid" [style.--qa-cols]="actions().length">
    @for (action of actions(); track action.id) {
      <a class="qa-btn"
         [ngClass]="variantClass(action.variant)"
         [routerLink]="action.routerLink"
         [queryParams]="action.queryParams ?? {}">
        <div class="qa-btn__icon-wrap" aria-hidden="true">
          <mat-icon>{{ action.icon }}</mat-icon>
        </div>
        <div class="qa-btn__content">
          <div class="qa-btn__title-row">
            <span class="qa-btn__title">{{ action.title }}</span>
            @if (action.adminBadge) {
              <span class="qa-btn__admin-badge">ADMIN</span>
            }
          </div>
          <p class="qa-btn__desc">{{ action.description }}</p>
        </div>
        <mat-icon class="qa-btn__arrow" aria-hidden="true">chevron_right</mat-icon>
      </a>
    }
  </div>
</div>
